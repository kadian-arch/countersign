name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"   # weekly, so a dependency update that breaks something shows up without a push

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e .
      # PayPal's Agent Toolkit pins old agent frameworks this project does not use, so only the package itself goes in
      - run: pip install requests && pip install --no-deps paypal-agent-toolkit==1.11.0
      - run: python -m unittest discover -s tests -t .

  stress:
    # the guard against a seeded stream of random attempted refunds and payouts, no model, no network.
    # it fails if any call that ran broke one of the sixteen rules in stress.py
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python scripts/stress_guard.py --n 20000 --seed 1 --no-save
      - run: python scripts/stress_guard.py --n 20000 --seed 2 --no-save

  mutation:
    # breaks the guard on purpose, one protection at a time, and fails if the stress test does not notice
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python scripts/mutation_check.py --n 1500

  dashboard:
    # the AG Studio dashboard: it has to install from its lock file, type-check and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm test
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t countersign .

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
