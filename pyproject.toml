[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "countersign"
version = "0.1.0"
description = "A guard for AI agents that move money through PayPal"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Kum Donalsien Akwo" }]
keywords = ["paypal", "ai-agents", "guardrails", "payments", "security"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.urls]
Repository = "https://github.com/kadian-arch/countersign"
Issues = "https://github.com/kadian-arch/countersign/issues"
Changelog = "https://github.com/kadian-arch/countersign/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
countersign = ["static/*", "static/days/*"]
