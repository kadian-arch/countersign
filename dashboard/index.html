<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countersign dashboard</title>
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#04050d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>html, body, #root { height: 100%; margin: 0; background: #04050d; }
.boot { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; box-sizing: border-box;
  background: radial-gradient(ellipse at 50% 35%, #131a4a 0%, #04050d 62%); color: #f0f2ff; font-family: "Figtree", "Segoe UI", sans-serif; }
.boot .mark { width: 86px; height: 86px; filter: drop-shadow(0 0 22px #6a82ff66); animation: bootfloat 3.2s ease-in-out infinite; }
.boot .ring { stroke-dasharray: 92; stroke-dashoffset: 92; animation: bootdraw 1.6s ease-out forwards, bootspin 6s linear 1.6s infinite; transform-origin: 20px 20px; }
.boot .tick { stroke-dasharray: 26; stroke-dashoffset: 26; animation: bootdraw 0.7s ease-out 1.1s forwards; }
.boot-title { margin: 6px 0 0; font: 600 26px "Bricolage Grotesque", "Segoe UI", sans-serif; letter-spacing: -.02em; }
.boot-line { margin: 0; color: #a3acd6; font-size: 15px; height: 22px; }
.boot-line span::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: bootdots 1.4s steps(4) infinite; }
.boot-tiles { display: flex; gap: 10px; margin-top: 22px; width: min(440px, 86vw); }
.boot-tiles i { flex: 1; height: 54px; border-radius: 12px; background: linear-gradient(100deg, #10143a 30%, #1d2565 50%, #10143a 70%); background-size: 220% 100%; animation: bootshimmer 1.6s linear infinite; }
.boot-tiles i:nth-child(2) { animation-delay: .15s } .boot-tiles i:nth-child(3) { animation-delay: .3s } .boot-tiles i:nth-child(4) { animation-delay: .45s }
@keyframes bootdraw { to { stroke-dashoffset: 0 } }
@keyframes bootspin { to { transform: rotate(360deg) } }
@keyframes bootfloat { 50% { transform: translateY(-5px) } }
@keyframes bootshimmer { from { background-position: 120% 0 } to { background-position: -120% 0 } }
@keyframes bootdots { 0% { content: "" } 25% { content: "." } 50% { content: ".." } 75% { content: "..." } }
@media (prefers-reduced-motion: reduce) { .boot * { animation: none !important; stroke-dashoffset: 0 !important; } }
</style>
</head>
<body>
<div id="root"><div class="boot" role="status" aria-live="polite">
  <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
    <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2fd9ff"/><stop offset=".5" stop-color="#6a82ff"/><stop offset="1" stop-color="#c866ff"/></linearGradient></defs>
    <circle class="ring" cx="20" cy="20" r="14.5" fill="none" stroke="url(#bg)" stroke-width="2.6" stroke-linecap="round"/>
    <path class="tick" d="M12.6 20.9 L17.7 25.6 L27.6 14.2" fill="none" stroke="url(#bg)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <p class="boot-title">Countersign</p>
  <p class="boot-line"><span>Opening the dashboard</span></p>
  <div class="boot-tiles" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
</div></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
